<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="860" height="374" viewBox="0 0 860 374" role="img" aria-labelledby="t d"><title id="t">Stack as a linker map</title><desc id="d">Tech stack laid out like a linker memory map. .text (core): Python, C++, C, TypeScript, SQL; .data (backend): FastAPI, asyncio, Celery, RabbitMQ, Redis; .bss (storage): MongoDB, PostgreSQL, MySQL; .rodata (ml/llm): vLLM, AWS Bedrock, OpenAI, scikit-learn; .init (infra): Docker, Linux, Git, AWS EC2/S3; .plt (glue): React, Streamlit</desc><style>@font-face{font-family:PM;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:PM;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}svg{--bg:#0A0C0D;--panel:#0E1112;--line:#1E2427;--grid:#14191B;--text:#E6E6E1;--dim:#5B6166;--mute:#3A4044;--accent:#B6FF3B;--on:#0A0C0D}text{font-family:PM,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-kerning:none}.d{font-family:SG,'Space Grotesk',system-ui,sans-serif}@keyframes on{from{opacity:0}to{opacity:1}}@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rm-hide{display:none}}.seg{animation:on .25s both}.row{animation:up .35s ease-out both}</style><rect width="860" height="374" rx="6" fill="#0A0C0D"/><rect x=".5" y=".5" width="859" height="373" rx="6" fill="none" stroke="#1E2427"/><defs><pattern id="ha" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="6" fill="#B6FF3B"/></pattern><pattern id="hd" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.4" height="6" fill="#5B6166"/></pattern><pattern id="hd2" width="5" height="5" patternUnits="userSpaceOnUse" patternTrans