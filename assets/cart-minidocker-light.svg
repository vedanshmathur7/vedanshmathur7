<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="192" viewBox="0 0 400 192" role="img" aria-labelledby="t d"><title id="t">mini-docker — A Linux container engine from first principles. No Docker, no runc, just syscalls.</title><desc id="d">Project cartridge for mini-docker (c++). A Linux container engine from first principles. No Docker, no runc, just syscalls. Stack: c++17, namespaces, cgroups-v2, chroot.</desc><style>@font-face{font-family:PM;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:PM;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:SG;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}svg{--bg:#F4F7F5;--panel:#FBFCFB;--line:#B8CDD6;--grid:#E2ECEF;--text:#0B3B57;--dim:#5F7F90;--mute:#A9C0CA;--accent:#0A7EA4;--on:#F4F7F5}text{font-family:PM,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-kerning:none}.d{font-family:SG,'Space Grotesk',system-ui,sans-serif}@keyframes on{from{opacity:0}to{opacity:1}}@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rm-hide{display:none}}.led{animation:blink 2.8s steps(1) infinite}</style><path d="M1 1H382L399 18V191H1Z" fill="#FBFCFB" stroke="#0B3B57" stroke-width="1"/><rect x="12" y="24" width="376" height="120" fill="none" stroke="#B8CDD6" stroke-width="1"/><text x="14" y="16" fill="#5F7F90" font-size="10.5" font-weight="600">ROM 0x03</text><rect x="339.1" y="5" width="30.9" height="15" fill="none" stroke="#5F7F90" stroke-width=".8"/><text x="345.1" y="16" fill="#0B3B57" font-size="10.5">c++</text><circle class="led" cx="329.1" cy="12.5" r="2.6" fill="#0A7EA4"/><text class="d" x="24" y="55" font-size="24" font-weight="70